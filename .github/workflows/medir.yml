name: Medir posição dos anúncios

on:
  schedule:
    - cron: '7,37 * * * *'   # a cada 30 minutos (minutos 07 e 37 de cada hora, em UTC)
  workflow_dispatch:          # permite rodar na mão pelo botão "Run workflow"

permissions:
  contents: write

concurrency:
  group: medir-posicao
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ler as listas e anotar as posições
        run: node medir.js

      - name: Guardar os resultados
        run: |
          git config user.name "medidor-automatico"
          git config user.email "medidor@users.noreply.github.com"
          git add dados RESUMO.md
          if git diff --cached --quiet; then
            echo "Nada novo para guardar"
          else
            git commit -m "Leitura $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
